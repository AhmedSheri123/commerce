{% extends "management_base.html" %}
{% load tailwind_filters %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<style>
  .select2-container {
    width: 100% !important;
  }

  .select2-container--default .select2-selection--multiple {
    min-height: 42px;
    border: 1px solid #d1d5db;
    border-radius: 0.5rem;
    padding: 4px;
  }
</style>
{% endblock extra_css %}

{% block content %}
<form method="post" enctype="multipart/form-data" class="bg-white p-3 rounded-md">
  {% csrf_token %}

  {{ form|crispy }}
  <button type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">ارسال</button>
</form>
{% endblock content %}

{% block extra_js %}
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
  $(function () {
    const $visibleUsers = $("#id_visible_to_users");
    if (!$visibleUsers.length) return;

    $visibleUsers.select2({
      width: "100%",
      dir: "rtl",
      placeholder: "ابحث عن مستخدم",
      allowClear: true
    });
  });
</script>
{% endblock extra_js %}
