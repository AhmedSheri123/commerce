{% extends 'base.html' %}
{% load static %}

{% block title %}Wallet{% endblock %}

{% block content %}
<div class="mx-auto w-full max-w-3xl p-4 pb-28">
  <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="text-sm text-slate-500">Current Balance</div>
    <div id="wallet-balance" class="mt-1 text-3xl font-bold text-slate-900">{{ balance|floatformat:4 }} USDT</div>
  </div>

  <div class="mt-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <h2 class="mb-4 text-lg font-semibold text-slate-900">Transfer Balance</h2>
    <form id="wallet-transfer-form" class="grid gap-3 md:grid-cols-3">
      <input
        id="to-username"
        type="text"
        placeholder="Recipient username"
        class="rounded-lg border border-slate-300 px-3 py-2"
        required
      />
      <input
        id="transfer-amount"
        type="number"
        min="0.0001"
        step="0.0001"
        placeholder="Amount"
        class="rounded-lg border border-slate-300 px-3 py-2"
        required
      />
      <input
        id="transfer-note"
        type="text"
        placeholder="Note (optional)"
        class="rounded-lg border border-slate-300 px-3 py-2"
      />
      <button
        type="submit"
        class="md:col-span-3 rounded-lg bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700"
      >
        Send
      </button>
    </form>
    <p id="wallet-message" class="mt-3 text-sm"></p>
  </div>

  <div class="mt-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <h2 class="mb-4 text-lg font-semibold text-slate-900">Wallet Ledger</h2>
    <div class="overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead>
          <tr class="border-b text-left text-slate-500">
            <th class="py-2">Time</th>
            <th class="py-2">Type</th>
            <th class="py-2">Amount</th>
            <th class="py-2">Counterparty</th>
            <th class="py-2">Balance After</th>
          </tr>
        </thead>
        <tbody id="wallet-ledger-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const walletBalanceApi = "{% url 'wallet:balance_api' %}";
  const walletLedgerApi = "{% url 'wallet:ledger_api' %}";
  const walletTransferApi = "{% url 'wallet:transfer_api' %}";

  function getCsrfToken() {
    const name = "csrftoken=";
    const parts = document.cookie.split(";");
    for (const partRaw of parts) {
      const part = partRaw.trim();
      if (part.startsWith(name)) {
        return decodeURIComponent(part.substring(name.length));
      }
    }
    return "";
  }

  function setMessage(text, ok) {
    const el = document.getElementById("wallet-message");
    el.textContent = text || "";
    el.className = "mt-3 text-sm " + (ok ? "text-green-600" : "text-red-600");
  }

  function renderLedger(items) {
    const body = document.getElementById("wallet-ledger-body");
    body.innerHTML = "";
    if (!items.length) {
      body.innerHTML = '<tr><td colspan="5" class="py-3 text-slate-500">No records yet.</td></tr>';
      return;
    }

    for (const row of items) {
      const tr = document.createElement("tr");
      tr.className = "border-b";
      const sign = row.direction === "in" ? "+" : "-";
      tr.innerHTML = `
        <td class="py-2">${row.created_at}</td>
        <td class="py-2">${row.direction === "in" ? "Credit" : "Debit"}</td>
        <td class="py-2 ${row.direction === "in" ? "text-green-600" : "text-red-600"}">${sign}${row.amount}</td>
        <td class="py-2">${row.counterparty || "-"}</td>
        <td class="py-2">${row.balance_after}</td>
      `;
      body.appendChild(tr);
    }
  }

  async function refreshBalance() {
    const res = await fetch(walletBalanceApi, { credentials: "same-origin" });
    const data = await res.json();
    document.getElementById("wallet-balance").textContent = `${data.balance} USDT`;
  }

  async function refreshLedger() {
    const res = await fetch(walletLedgerApi, { credentials: "same-origin" });
    const data = await res.json();
    renderLedger(data.items || []);
  }

  document.getElementById("wallet-transfer-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    setMessage("", true);

    const payload = {
      to_username: document.getElementById("to-username").value.trim(),
      amount: document.getElementById("transfer-amount").value.trim(),
      note: document.getElementById("transfer-note").value.trim(),
    };

    const res = await fetch(walletTransferApi, {
      method: "POST",
      credentials: "same-origin",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": getCsrfToken(),
      },
      body: JSON.stringify(payload),
    });

    const data = await res.json();
    if (!res.ok || !data.ok) {
      setMessage(data.message || "Transfer failed.", false);
      return;
    }

    setMessage(data.message || "Transfer completed.", true);
    document.getElementById("transfer-amount").value = "";
    document.getElementById("transfer-note").value = "";
    await refreshBalance();
    await refreshLedger();
  });

  window.addEventListener("load", async () => {
    await refreshBalance();
    await refreshLedger();
  });
</script>
{% endblock %}
